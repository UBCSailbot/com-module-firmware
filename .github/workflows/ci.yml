name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ioc-sync:
    name: CubeMX .ioc in sync with generated code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check .ioc peripherals against main.c
        run: python3 tools/check_ioc_sync.py .

  host-tests:
    name: Host unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The harness in firmware/tests builds the drv-modules against stub HAL
      # headers with plain gcc, so no ARM toolchain is needed here.
      - name: Build and run module tests
        working-directory: firmware
        run: make -C tests test
