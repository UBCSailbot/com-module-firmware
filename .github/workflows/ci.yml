name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ioc-sync:
    name: CubeMX .ioc in sync with generated code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check .ioc peripherals against main.c
        run: python3 tools/check_ioc_sync.py .

  host-tests:
    name: Host unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The harness in firmware/tests builds the drv-modules against stub HAL
      # headers with plain gcc, so no ARM toolchain is needed here.
      - name: Build and run module tests
        working-directory: firmware
        run: |
          set -euo pipefail
          # canfd_test is deliberately excluded: it does not compile, because
          # the stub HAL in tests/stubs lacks TIM_HandleTypeDef,
          # HAL_TIM_Base_Start_IT, FDCAN_IT_DATA_PROTOCOL_ERROR,
          # FDCAN_IT_ARB_PROTOCOL_ERROR and __weak, all of which
          # com-modules/CANFD/can.c needs. Pre-existing, not a regression.
          # Re-add it here once the stubs cover those.
          fail=0
          for t in nmea0183_test wind_sensor_test ais_test gps_test \
                   nmea0183_scheduler_test; do
            echo "::group::$t"
            make -C tests "../tests/build/$t"
            ./tests/build/"$t" || fail=1
            echo "::endgroup::"
          done
          exit $fail
