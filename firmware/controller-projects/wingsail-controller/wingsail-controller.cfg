# ST-LINK interface. Support both upstream OpenOCD and ST's DAP config.
if {[catch {source [find interface/stlink.cfg]}]} {
    source [find interface/stlink-dap.cfg]
    transport select dapdirect_swd
} else {
    transport select hla_swd
}

# STM32U5 target (covers STM32U575)
source [find target/stm32u5x.cfg]

# Reset configuration
reset_config srst_only
